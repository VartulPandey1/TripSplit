<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="auto">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b231e"/>
      <stop offset="100%" stop-color="#141a16"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a6454"/>
      <stop offset="100%" stop-color="#7e9a88"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Background -->
  <rect width="1200" height="480" rx="20" fill="#0f1411"/>
  <rect width="1200" height="480" rx="20" fill="none" stroke="#222b25" stroke-width="1.5"/>

  <!-- Section Header -->
  <g transform="translate(60, 45)">
    <text x="0" y="24" fill="#7e9a88" font-size="12" font-weight="700" letter-spacing="1.5" class="font-sans">KEY ARCHITECTURE &amp; CAPABILITIES</text>
    <text x="0" y="58" fill="#ffffff" font-size="28" font-weight="800" letter-spacing="-0.5" class="font-sans">Engineered for seamless group adventures</text>
  </g>

  <!-- 4 Feature Columns -->
  <!-- Card 1: Itinerary & Planning -->
  <g transform="translate(60, 130)" filter="url(#boxShadow)">
    <rect width="255" height="300" rx="16" fill="url(#cardGrad)" stroke="#2d3931" stroke-width="1.2"/>
    <rect x="20" y="22" width="44" height="44" rx="12" fill="#243028"/>
    <text x="42" y="49" fill="#ccead5" font-size="20" text-anchor="middle" class="font-sans">🗺️</text>
    
    <text x="20" y="95" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Smart Itinerary</text>
    <text x="20" y="115" fill="#7e9a88" font-size="12" font-weight="500" class="font-sans">&amp; Trip Collaboration</text>

    <text x="20" y="148" fill="#9cb1a4" font-size="12" line-height="18" class="font-sans">
      <tspan x="20" dy="0">• Day-by-day timeline builder</tspan>
      <tspan x="20" dy="22">• Location pins &amp; flight notes</tspan>
      <tspan x="20" dy="22">• Collaborative packing lists</tspan>
      <tspan x="20" dy="22">• 6-character room codes</tspan>
      <tspan x="20" dy="22">• Activity voting &amp; tasks</tspan>
    </text>

    <!-- Mini Footer Badge -->
    <rect x="20" y="245" width="215" height="32" rx="8" fill="#18201a" stroke="#253229" stroke-width="1"/>
    <text x="127" y="265" fill="#a4baa9" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Real-time collaboration</text>
  </g>

  <!-- Card 2: Price Guessing & Dual Budgets -->
  <g transform="translate(335, 130)" filter="url(#boxShadow)">
    <rect width="255" height="300" rx="16" fill="url(#cardGrad)" stroke="#2d3931" stroke-width="1.2"/>
    <rect x="20" y="22" width="44" height="44" rx="12" fill="#243028"/>
    <text x="42" y="49" fill="#ccead5" font-size="20" text-anchor="middle" class="font-sans">🎯</text>
    
    <text x="20" y="95" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Budget Guessing</text>
    <text x="20" y="115" fill="#7e9a88" font-size="12" font-weight="500" class="font-sans">&amp; Dual Personal Targets</text>

    <text x="20" y="148" fill="#9cb1a4" font-size="12" line-height="18" class="font-sans">
      <tspan x="20" dy="0">• Gamified price guessing</tspan>
      <tspan x="20" dy="22">• Median consensus target</tspan>
      <tspan x="20" dy="22">• Shared trip budget target</tspan>
      <tspan x="20" dy="22">• Private personal limit</tspan>
      <tspan x="20" dy="22">• Group approval sign-off</tspan>
    </text>

    <!-- Mini Footer Badge -->
    <rect x="20" y="245" width="215" height="32" rx="8" fill="#18201a" stroke="#253229" stroke-width="1"/>
    <text x="127" y="265" fill="#a4baa9" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Zero financial surprises</text>
  </g>

  <!-- Card 3: Expenses & Settle-Up -->
  <g transform="translate(610, 130)" filter="url(#boxShadow)">
    <rect width="255" height="300" rx="16" fill="url(#cardGrad)" stroke="#2d3931" stroke-width="1.2"/>
    <rect x="20" y="22" width="44" height="44" rx="12" fill="#243028"/>
    <text x="42" y="49" fill="#ccead5" font-size="20" text-anchor="middle" class="font-sans">⚖️</text>
    
    <text x="20" y="95" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Smart Settle Up</text>
    <text x="20" y="115" fill="#7e9a88" font-size="12" font-weight="500" class="font-sans">&amp; Expense Splitting</text>

    <text x="20" y="148" fill="#9cb1a4" font-size="12" line-height="18" class="font-sans">
      <tspan x="20" dy="0">• Equal &amp; custom splits</tspan>
      <tspan x="20" dy="22">• Full expense &amp; traveler edit</tspan>
      <tspan x="20" dy="22">• O(N) debt graph reduction</tspan>
      <tspan x="20" dy="22">• Multi-currency conversion</tspan>
      <tspan x="20" dy="22">• Minimalist visual analytics</tspan>
    </text>

    <!-- Mini Footer Badge -->
    <rect x="20" y="245" width="215" height="32" rx="8" fill="#18201a" stroke="#253229" stroke-width="1"/>
    <text x="127" y="265" fill="#a4baa9" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">Minimum debt transfers</text>
  </g>

  <!-- Card 4: Offline PWA & Sync -->
  <g transform="translate(885, 130)" filter="url(#boxShadow)">
    <rect width="255" height="300" rx="16" fill="url(#cardGrad)" stroke="#2d3931" stroke-width="1.2"/>
    <rect x="20" y="22" width="44" height="44" rx="12" fill="#243028"/>
    <text x="42" y="49" fill="#ccead5" font-size="20" text-anchor="middle" class="font-sans">📶</text>
    
    <text x="20" y="95" fill="#ffffff" font-size="16" font-weight="700" class="font-sans">Offline-First PWA</text>
    <text x="20" y="115" fill="#7e9a88" font-size="12" font-weight="500" class="font-sans">&amp; Local IndexedDB</text>

    <text x="20" y="148" fill="#9cb1a4" font-size="12" line-height="18" class="font-sans">
      <tspan x="20" dy="0">• Dexie.js browser database</tspan>
      <tspan x="20" dy="22">• Log expenses on airplanes</tspan>
      <tspan x="20" dy="22">• Auto background cloud sync</tspan>
      <tspan x="20" dy="22">• Proxy security &amp; rate limit</tspan>
      <tspan x="20" dy="22">• Installable app manifest</tspan>
    </text>

    <!-- Mini Footer Badge -->
    <rect x="20" y="245" width="215" height="32" rx="8" fill="#18201a" stroke="#253229" stroke-width="1"/>
    <text x="127" y="265" fill="#a4baa9" font-size="11" font-weight="600" text-anchor="middle" class="font-sans">100% offline capability</text>
  </g>
</svg>
